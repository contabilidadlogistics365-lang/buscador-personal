<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrador - Buscador de Personal</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Librería para procesar Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    .admin-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .admin-card {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 1.5rem;
    }
    .file-drop {
      border: 2px dashed #2563eb;
      background-color: #f0f9ff;
      padding: 2rem;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    textarea.code-output {
      width: 100%;
      height: 250px;
      font-family: monospace;
      font-size: 0.85rem;
      background-color: #1e293b;
      color: #38bdf8;
      padding: 1rem;
      border-radius: 6px;
      border: none;
      resize: vertical;
    }
    .step-badge {
      background-color: #2563eb;
      color: white;
      padding: 0.2rem 0.6rem;
      border-radius: 50%;
      font-size: 0.85rem;
      margin-right: 0.5rem;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <img src="logo.png" alt="Logo Empresa" class="logo">
      <div>
        <h1 class="title">Panel de Administración</h1>
        <p class="subtitle">Convertidor de Excel a datos.js</p>
      </div>
    </div>
  </header>

  <main class="admin-container">
    
    <!-- Paso 1: Cargar Excel -->
    <div class="admin-card">
      <h3><span class="step-badge">1</span> Cargar nuevo archivo Excel</h3>
      <p style="margin: 0.5rem 0 1rem; font-size: 0.9rem; color: #64748b;">
        Selecciona el archivo Excel que contiene las columnas: <strong>Tipo de documento</strong>, <strong>Documento</strong> y <strong>Nombre</strong>.
      </p>
      
      <div class="file-drop">
        <input type="file" id="excelInput" accept=".xlsx, .xls">
        <p id="statusMsg" style="margin-top: 0.75rem; font-weight: 600; color: #475569;"></p>
      </div>
    </div>

    <!-- Paso 2: Generar Código -->
    <div class="admin-card">
      <h3><span class="step-badge">2</span> Código generado para datos.js</h3>
      <p style="margin: 0.5rem 0 1rem; font-size: 0.9rem; color: #64748b;">
        Copia este código y pégalo directamente en el archivo <strong>datos.js</strong> dentro de GitHub.
      </p>

      <textarea id="codeOutput" class="code-output" readonly placeholder="// Aquí aparecerá el código formateado cuando cargues tu Excel..."></textarea>
      
      <div style="margin-top: 1rem; display: flex; align-items: center; gap: 1rem;">
        <button id="btnCopyCode" class="btn btn-primary" disabled>📋 Copiar código generado</button>
        <span id="copyMsg" style="font-size: 0.9rem; font-weight: 600;"></span>
      </div>
    </div>

  </main>

  <script>
    const excelInput = document.getElementById('excelInput');
    const statusMsg = document.getElementById('statusMsg');
    const codeOutput = document.getElementById('codeOutput');
    const btnCopyCode = document.getElementById('btnCopyCode');
    const copyMsg = document.getElementById('copyMsg');

    excelInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = (evt) => {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const jsonData = XLSX.utils.sheet_to_json(firstSheet);

          // Convertir filas a formato JavaScript
          const trabajadores = jsonData.map(row => ({
            tipoDoc: String(row['Tipo de documento'] || row['Tipo Doc'] || row['TIPO DE DOCUMENTO'] || '').trim(),
            documento: String(row['Documento'] || row['DOCUMENTO'] || '').trim(),
            nombre: String(row['Nombre'] || row['NOMBRE'] || '').trim()
          })).filter(t => t.nombre !== '' || t.documento !== '');

          if (trabajadores.length === 0) {
            statusMsg.style.color = '#ef4444';
            statusMsg.textContent = '❌ No se encontraron datos válidos en el archivo.';
            return;
          }

          // Armar la estructura del texto para datos.js
          const jsonString = JSON.stringify(trabajadores, null, 2);
          const finalCode = `// Base de datos de trabajadores - Actualizada el ${new Date().toLocaleDateString()}\nconst trabajadores = ${jsonString};`;

          codeOutput.value = finalCode;
          btnCopyCode.disabled = false;
          statusMsg.style.color = '#16a34a';
          statusMsg.textContent = `✅ ¡Procesados ${trabajadores.length} empleados correctamente de "${file.name}"!`;

        } catch (err) {
          console.error(err);
          statusMsg.style.color = '#ef4444';
          statusMsg.textContent = '❌ Error al leer el archivo Excel.';
        }
      };

      reader.readAsArrayBuffer(file);
    });

    // Copiar código al portapapeles
    btnCopyCode.addEventListener('click', () => {
      navigator.clipboard.writeText(codeOutput.value).then(() => {
        copyMsg.style.color = '#16a34a';
        copyMsg.textContent = '✅ Código copiado al portapapeles.';
      }).catch(() => {
        copyMsg.style.color = '#ef4444';
        copyMsg.textContent = '❌ No se pudo copiar automáticamente.';
      });
    });
  </script>
</body>
</html>
